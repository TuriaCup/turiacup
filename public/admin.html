<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Turia Cup</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/brand/badge-black.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="admin-topbar">
  <div class="container admin-topbar-inner">
    <a href="index.html" class="logo"><img src="img/brand/logo-lockup-black.png" alt="Turia Cup"></a>
    <span class="admin-title">Panel de administración</span>
    <button class="btn-small" id="logoutBtn" hidden>Cerrar sesión</button>
  </div>
</header>

<section class="section" id="loginSection" hidden>
  <div class="container">
    <div class="login-box">
      <h1>Acceso admin</h1>
      <form id="loginForm">
        <div class="form-row">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <p class="feedback error" id="loginFeedback"></p>
      </form>
    </div>
  </div>
</section>

<section class="section" id="dashboardSection" hidden>
  <div class="container">
    <div class="tabs" id="adminTabs">
      <button class="tab-btn" data-tab="equipos">Equipos</button>
      <button class="tab-btn" data-tab="plantillas">Plantillas</button>
      <button class="tab-btn" data-tab="partidos">Partidos</button>
    </div>

    <div class="admin-panel" id="panelEquipos"></div>
    <div class="admin-panel" id="panelPlantillas" hidden></div>
    <div class="admin-panel" id="panelPartidos" hidden></div>
  </div>
</section>

<script src="js/utils.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
