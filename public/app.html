<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="/js/redireccion.js"></script>
<script>
  // Instalada en la pantalla de inicio (sin barras de Safari): ver «Alto de la app» en css/app.css.
  (function () {
    var html = document.documentElement;
    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) html.classList.add('instalada');
    // iPhone instalado: iOS solo deja dibujar en la ventana (innerHeight), que es más baja que la pantalla
    // (iPhone 16 Pro Max: pantalla 956, ventana 894; faltan los 62 de la barra de estado). Lo que pase de la ventana
    // no se pinta, pero ese trozo de abajo ya deja sitio a la barra de inicio. Si el trozo es al menos tan alto como el
    // margen de la barra de inicio, el menú no necesita su margen inferior (.hueco-abajo) y el trozo se pinta del
    // color del menú. Si un día iOS lo corrige, el trozo desaparece y vuelve el margen normal solo.
    if (navigator.standalone === true) {
      var medir = function () {
        var vertical = window.matchMedia('(orientation: portrait)').matches;
        var altoPantalla = vertical ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        html.classList.toggle('hueco-abajo', altoPantalla - window.innerHeight >= 20);
      };
      medir();
      window.addEventListener('resize', medir);
      window.addEventListener('orientationchange', function () { setTimeout(medir, 300); });
    }
  }());
</script>
<title>Turia Cup</title>
<meta name="description" content="Resultados, clasificaciones, partidos en directo y equipos de la Turia Cup.">
<meta name="theme-color" content="#1c130a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turia Cup">
<!-- iOS ignora este valor en la app instalada y pone la barra de estado translúcida igualmente (comprobado en un
     iPhone con iOS 18.7). El hueco que eso deja abajo se trata en app.html (clase .hueco-abajo) y en css/app.css. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/img/brand/badge-black.png">
<link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/torneo.css">
<link rel="stylesheet" href="/css/clasificacion.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-body">

<div class="app" id="app">
  <header class="app-top" id="appTop"></header>
  <div class="app-aviso" id="appAviso" hidden></div>
  <div class="app-banner" id="appBanner" role="status" hidden></div>
  <main class="app-view" id="appView"></main>
  <nav class="app-tabs" id="appTabs" aria-label="Secciones"></nav>
  <div class="app-sheet-fondo" id="appSheet" hidden></div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/miniplano.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
